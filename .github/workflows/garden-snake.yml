name: Tend the contribution garden

on:
  schedule:
    # 00:17 in Pakistan (UTC+5), away from the top-of-hour Actions rush.
    - cron: "17 19 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Grow light and dark contribution gardens
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-garden.gif?color_snake=#F5B642&color_dots=#F5E6C8,#B9D58C,#86B56A,#5F914F,#3D6D3A&color_background=#FFFFFF
            dist/contribution-garden-dark.gif?color_snake=#F5B642&color_dots=#172019,#355848,#568A4B,#7FA650,#A8D36F&color_background=#0D1117

      - name: Publish the garden to the output branch
        uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
